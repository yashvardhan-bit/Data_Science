
<!DOCTYPE html>
<html>
<head>
    <title>InterviewAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .main-container { background: white; border-radius: 20px; margin: 50px auto; padding: 40px; max-width: 600px; }
        .btn-primary { background: linear-gradient(45deg, #4a90e2, #357abd); border: none; border-radius: 25px; padding: 15px 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-container">
            <div class="text-center mb-4">
                <h2 class="text-primary"><i class="fas fa-cog"></i> InterviewAI</h2>
            </div>
            
            {% if error %}
            <div class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-triangle"></i> {{ error }}
            </div>
            {% endif %}
            
            <form method="POST" action="{{ url_for('configure') }}">
                <div class="row g-3">
                    <div class="col-md-8 mx-auto">
                        <label class="form-label fw-bold">Choose Your Field</label>
                        <select class="form-select" name="category" required>
                            <option value="All">All Technical Fields</option>
                            {% for category in categories %}
                            <option value="{{ category }}">{{ category }}</option>
                            {% endfor %}
                        </select>
                        <div class="form-text">Choose your area. AI will select relevant questions.</div>
                    </div>
                    
                    <div class="col-md-8 mx-auto">
                        <label class="form-label fw-bold">Number of Questions</label>
                        <div class="row">
                            <div class="col-md-6">
                                <input type="range" class="form-range" name="count" min="5" max="20" value="10" oninput="updateCount(this.value)">
                            </div>
                            <div class="col-md-6">
                                <span class="badge bg-primary fs-6" id="countDisplay">10 Questions</span>
                            </div>
                        </div>
                        <div class="form-text">AI will generate additional questions if needed.</div>
                    </div>
                    
                    <div class="col-12">
                        <div class="alert alert-success">
                            <small>
                                <strong>AI Interview:</strong> Smart selection, dynamic questions, adaptive level.
                            </small>
                        </div>
                    </div>
                    
                    <div class="col-12 text-center">
                        <button type="submit" class="btn btn-primary btn-lg me-3">
                            <i class="fas fa-play"></i> Start AI Interview
                        </button>
                        <a href="{{ url_for('home') }}" class="btn btn-outline-secondary btn-lg me-2">
                            <i class="fas fa-arrow-left"></i> Back
                        </a>
                        <a href="{{ url_for('exit_interview') }}" class="btn btn-outline-danger btn-lg">
                            <i class="fas fa-times"></i> Exit
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
    
    <script>
    function updateCount(value) {
        document.getElementById('countDisplay').textContent = value + ' Questions';
    }
    document.addEventListener('DOMContentLoaded', function() {
        updateCount(10);
    });
    </script>
</body>
</html>
