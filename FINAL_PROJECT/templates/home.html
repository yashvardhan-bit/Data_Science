<!DOCTYPE html>
<html>
<head>
    <title>Technical AI Interview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .main-container { background: white; border-radius: 20px; margin: 50px auto; padding: 40px; max-width: 800px; }
        .btn-primary { background: linear-gradient(45deg, #4a90e2, #357abd); border: none; border-radius: 25px; padding: 15px 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-container">
            <div class="text-center mb-5">
                <h1 class="display-4 text-primary mb-3">
                    <i class="fas fa-robot"></i> InterviewAI
                </h1>
                <p class="lead text-muted">AI-powered technical assessment</p>
            </div>
            
            <!-- Features -->
            <div class="row g-4 mb-5">
                <div class="col-md-4">
                    <div class="card text-center h-100">
                        <div class="card-body">
                            <i class="fas fa-brain text-primary mb-3" style="font-size: 3rem;"></i>
                            <h5>ML Training</h5>
                            <p>Trained on 200+ questions with synthetic data</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center h-100">
                        <div class="card-body">
                            <i class="fas fa-robot text-success mb-3" style="font-size: 3rem;"></i>
                            <h5>AI Evaluation</h5>
                            <p>Gemma 3 provides detailed feedback</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center h-100">
                        <div class="card-body">
                            <i class="fas fa-chart-line text-warning mb-3" style="font-size: 3rem;"></i>
                            <h5>Hybrid Scoring</h5>
                            <p>60% ML + 40% AI for accurate results</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- System Status -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header bg-info text-white">
                            <h6 class="mb-0"><i class="fas fa-server"></i> AI Status</h6>
                        </div>
                        <div class="card-body">
                            <div class="d-flex align-items-center">
                                <div class="spinner-border spinner-border-sm text-primary me-2" id="ollamaSpinner"></div>
                                <span id="ollamaStatus">Checking...</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header bg-success text-white">
                            <h6 class="mb-0"><i class="fas fa-brain"></i> ML Status</h6>
                        </div>
                        <div class="card-body">
                            <div class="d-flex align-items-center">
                                <div class="spinner-border spinner-border-sm text-success me-2" id="mlSpinner"></div>
                                <span id="mlStatus">Checking...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Start Button -->
            <div class="text-center">
                <a href="{{ url_for('configure') }}" class="btn btn-primary btn-lg">
                    <i class="fas fa-play"></i> Start Interview
                </a>
            </div>
        </div>
    </div>
    
    <script>
    fetch('/check_ollama').then(r => r.json()).then(data => {
        document.getElementById('ollamaStatus').innerHTML = data.status === 'running' ? 
            '<i class="fas fa-check-circle text-success"></i> Ollama Ready' : 
            '<i class="fas fa-exclamation-triangle text-warning"></i> Ollama Not Running';
        document.getElementById('ollamaSpinner').style.display = 'none';
    });
    
    fetch('/ml_status').then(r => r.json()).then(data => {
        document.getElementById('mlStatus').innerHTML = data.is_trained ? 
            '<i class="fas fa-check-circle text-success"></i> ML Model Ready' : 
            '<i class="fas fa-exclamation-triangle text-warning"></i> ML Not Trained';
        document.getElementById('mlSpinner').style.display = 'none';
    });
    </script>
</body>
</html>
